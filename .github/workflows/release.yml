name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    outputs:
      has_changesets: ${{ steps.changesets.outputs.hasChangesets }}
      should_publish: ${{ steps.publish-check.outputs.should_publish }}
    permissions:
      contents: write
      issues: read
      pull-requests: write
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      # Version comes from `packageManager` in package.json.
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install npm
        run: npm install -g npm@11.15.0

      # Opens/updates the "Version Packages" PR while there are pending changesets.
      - name: Create Release Pull Request
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm run version
          commitMode: github-api
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # No pending changesets: the Version Packages PR was just merged (or
      # nothing changed). Publish only if package.json has a version npm
      # doesn't know about yet.
      - name: Check for unpublished package versions
        if: steps.changesets.outputs.hasChangesets == 'false'
        id: publish-check
        run: node .github/scripts/has-unpublished-packages.mjs

  publish:
    name: Publish
    needs: release
    if: needs.release.outputs.should_publish == 'true'
    # Restricted to `main` (repo Settings → Environments). Add yourself as a
    # required reviewer there once the repo is public: GitHub doesn't offer
    # required reviewers for private repos on this plan. Until then the
    # human gate is `npm stage approve`.
    environment:
      name: npm
      url: https://www.npmjs.com/package/preact-devtools-overlay
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install npm
        run: npm install -g npm@11.15.0

      # No separate build step: stage-packages.mjs stages the package with
      # `pnpm stage publish`, whose prepublishOnly hook runs build.mjs.

      # changesets/action skips `git config user.*` in github-api commit mode,
      # and checkout uses persist-credentials: false, so no identity is set.
      # stage-packages.mjs creates annotated tags (`git tag -m`), which require one.
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Uses npm trusted publishing (OIDC, `id-token: write`); no NPM_TOKEN.
      # Packages are *staged*, not published: approve them with
      # `npm stage approve <stage-id>` (the id is printed in the log).
      - name: Publish packages
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: node .github/scripts/stage-packages.mjs
          createGithubReleases: true
          commitMode: github-api
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
